name: Website readiness

on:
  pull_request:
    paths:
      - ".github/workflows/website-readiness.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "flake.nix"
      - "flake.lock"
      - "astro.config.mjs"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "docs/**"
      - "webcomposer/**"
      - "vercel.json"
      - "env.example"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/website-readiness.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "flake.nix"
      - "flake.lock"
      - "astro.config.mjs"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "docs/**"
      - "webcomposer/**"
      - "vercel.json"
      - "env.example"
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run local Playwright smoke after checks and build"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Diagnostics and build
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run Astro diagnostics
        run: nix develop --command pnpm check

      - name: Check WebComposer contract
        run: nix develop --command pnpm check:webcomposer

      - name: Check catalog artifact provenance
        run: nix develop --command pnpm check:catalog-artifact

      - name: Check shared catalog drift
        run: nix develop --command pnpm check:shared-catalog

      - name: Check release workflow coverage
        run: nix develop --command pnpm check:release-workflow

      - name: Check social preview asset
        run: nix develop --command pnpm check:social-preview

      - name: Build website
        run: nix develop --command pnpm build

  smoke:
    name: Local website smoke
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    needs: check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_smoke)
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run local website smoke
        run: nix develop --command pnpm smoke:local
