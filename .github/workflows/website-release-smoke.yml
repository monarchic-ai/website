name: Website release smoke

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Production website smoke target. Use www while apex routing is under investigation."
        required: false
        type: string
        default: "https://www.monarchic.io"
      expected_canonical_url:
        description: "Expected canonical URL origin"
        required: false
        type: string
        default: "https://monarchic.io"
      webapp_url:
        description: "Expected app CTA target origin"
        required: false
        type: string
        default: "https://app.monarchic.io"
      include_staging:
        description: "Run the staging website smoke gate"
        required: false
        type: boolean
        default: true
      staging_website_url:
        description: "Staging website smoke target"
        required: false
        type: string
        default: "https://staging.monarchic.io"
      staging_expected_canonical_url:
        description: "Expected staging canonical URL origin"
        required: false
        type: string
        default: "https://staging.monarchic.io"

permissions:
  contents: read

concurrency:
  group: website-release-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-smoke:
    name: External website gates
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 25

    env:
      MONARCHIC_WEBSITE_SMOKE_URL: ${{ inputs.website_url }}
      MONARCHIC_WEBSITE_EXPECTED_CANONICAL_URL: ${{ inputs.expected_canonical_url }}
      MONARCHIC_WEBAPP_SMOKE_URL: ${{ inputs.webapp_url }}
      MONARCHIC_WEBSITE_SMOKE_REPORT: website-production-smoke-report.json
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run production website smoke
        run: nix develop --command flock --wait 600 /tmp/monarchic-frontend-browser-smoke.lock pnpm smoke:production

      - name: Run staging website smoke
        if: inputs.include_staging
        env:
          MONARCHIC_WEBSITE_SMOKE_URL: ${{ inputs.staging_website_url }}
          MONARCHIC_WEBSITE_EXPECTED_CANONICAL_URL: ${{ inputs.staging_expected_canonical_url }}
          MONARCHIC_WEBSITE_SMOKE_REPORT: website-staging-smoke-report.json
        run: nix develop --command flock --wait 600 /tmp/monarchic-frontend-browser-smoke.lock pnpm smoke:production

      - name: Upload website smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-release-smoke-report
          path: |
            website-production-smoke-report.json
            website-staging-smoke-report.json
          if-no-files-found: ignore
